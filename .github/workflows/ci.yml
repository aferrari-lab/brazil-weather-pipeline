# CI do projeto: roda a cada push na main e em todo pull request.
#
# - lint:    ruff (Python) — mesma versão do pre-commit;
# - testes:  pytest com Java, para os testes do Spark rodarem (no Windows eles são pulados);
# - dags:    as DAGs carregam no Airflow 3.1 de verdade, com as constraints oficiais;
# - dbt:     Postgres de serviço + silver de amostra → dbt build, sqlfluff e o job de previsão;
# - imagens: as quatro imagens Docker do projeto constroem sem erro.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo cancela a execução anterior do mesmo branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.6.9
      - run: ruff check .
      - run: ruff format --check .

  testes:
    runs-on: ubuntu-latest
    env:
      # Os workers do Spark usam o mesmo Python dos testes.
      PYSPARK_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # O pyspark 3.5 ainda importa o distutils, que saiu do Python 3.12: o setuptools o devolve.
      - run: pip install -r requirements-dev.txt pyspark==3.5.6 setuptools
      - run: pytest -q

  dags:
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: /tmp/airflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instala o Airflow 3.1 com as constraints oficiais
        run: >
          pip install "apache-airflow==3.1.0" -r airflow/requirements.txt pytest pyyaml
          --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.1.0/constraints-3.12.txt
      - run: pytest -q tests/test_orquestracao.py tests/test_infra.py

  dbt:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dw
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: warehouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dw" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      WAREHOUSE_HOST: localhost
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_USER: dw
      WAREHOUSE_PASSWORD: ci
      WAREHOUSE_DB: warehouse
      DBT_PROFILES_DIR: .
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: >
          pip install "dbt-core==1.10.15" "dbt-postgres==1.10.2"
          "sqlfluff==3.4.2" "sqlfluff-templater-dbt==3.4.2" -r ml/requirements.txt
      - name: Silver de amostra
        run: python ci/silver_amostra.py
      - name: dbt build (modelos + testes de dados)
        working-directory: dbt
        run: dbt build
      - name: sqlfluff (lint do SQL)
        working-directory: dbt
        run: sqlfluff lint models tests
      - name: Previsão de temperatura
        run: python ml/previsao.py

  imagens:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        imagem: [airflow, spark, dbt, ml]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t brazil-weather-${{ matrix.imagem }}:ci ./${{ matrix.imagem }}
