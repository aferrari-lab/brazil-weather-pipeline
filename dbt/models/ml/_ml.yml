version: 2

models:
  - name: ml_features_temperatura
    description: >
      Features para prever a temperatura média de um dia com informação só até a
      véspera (lags, média dos 7 dias anteriores, sazonalidade, coordenadas). Inclui,
      por município, a linha do dia seguinte ao último dado (conjunto = 'futuro'),
      que é a previsão publicada. Lida pelo job ml/previsao.py.
    tests:
      - combinacao_unica:
          arguments:
            colunas: [codigo_ibge, data]
    columns:
      - name: conjunto
        tests:
          - accepted_values:
              arguments:
                values: [historico, futuro]
      - name: temp_media_d1
        description: Temperatura média da véspera. É também o palpite de "persistência".
        tests: [not_null]
      - name: alvo_temp_media_c
        description: O que o modelo tenta acertar. Vazio nas linhas do conjunto 'futuro'.
