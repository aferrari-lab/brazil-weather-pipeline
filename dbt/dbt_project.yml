name: brazil_weather
version: "1.0.0"
config-version: 2

# Nome do perfil de conexão, definido em profiles.yml (nesta mesma pasta).
profile: brazil_weather

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
clean-targets: ["target", "dbt_packages"]

models:
  brazil_weather:
    # Staging: um modelo por tabela de origem, só padronizando nomes e tipos.
    # Como views, não ocupam espaço e sempre refletem a silver mais recente.
    staging:
      +schema: staging
      +materialized: view
    # Intermediate: cálculos reaproveitados pelos marts (médias móveis etc.).
    # Também como views: são passos do caminho, não tabelas para consulta direta.
    intermediate:
      +schema: intermediate
      +materialized: view
    # Marts (gold): o modelo estrela que o dashboard e a análise consomem. Como
    # tabelas, as consultas ficam rápidas e não recalculam nada a cada acesso.
    marts:
      +schema: gold
      +materialized: table
    # Observabilidade: a saúde do próprio pipeline (cobertura, volume, cargas e
    # testes), para o painel do Metabase. Tabelas pequenas, recalculadas inteiras.
    observabilidade:
      +schema: observabilidade
      +materialized: table

vars:
  # Início do histórico do projeto (o mesmo da ingestão do Open-Meteo).
  data_inicio: "2025-01-01"
  # Chuva a partir da qual o dia conta como "dia de chuva" (critério usual em
  # climatologia).
  limite_dia_chuva_mm: 1.0
  # Eventos climáticos (ver models/marts/fct_eventos_climaticos.sql).
  percentil_dia_quente: 0.9
  percentil_dia_frio: 0.1
  percentil_chuva_extrema: 0.95
  chuva_minima_extrema_mm: 20
  dias_minimos_onda: 3
  dias_minimos_estiagem: 30
  # Abaixo disso o limiar do mês ainda tem pouca base (cerca de 2 anos de um mês).
  dias_minimos_base_limiar: 50

# Histórico de cada execução do dbt (ver macros/resultados_dbt.sql).
on-run-start:
  - "{{ criar_tabela_resultados() }}"
on-run-end:
  - "{{ registrar_resultados(results) }}"

tests:
  brazil_weather:
    # Guardo as linhas que falharam em cada teste numa tabela, para investigar
    # o problema direto no banco em vez de só ver "falhou".
    +store_failures: true
    +schema: testes_falhas
