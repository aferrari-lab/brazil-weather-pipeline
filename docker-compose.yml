# Ambiente local do pipeline: Postgres (warehouse + metadados do Airflow),
# RustFS (data lake S3) e Airflow 3 com LocalExecutor.
# Subir: docker compose up -d   |   Derrubar: docker compose down

x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE:-apache/airflow:3.1.0}
  env_file: .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"  # só para dev local: sem tela de login
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW_CONN_WAREHOUSE: postgresql://${WAREHOUSE_USER}:${WAREHOUSE_PASSWORD}@postgres:5432/${WAREHOUSE_DB}
    # Dentro da rede do Docker o lake é "lake:9000", não "localhost:9000" (que vem do .env).
    S3_ENDPOINT_URL: http://lake:9000
    AIRFLOW_CONN_LAKE: aws://${LAKE_ACCESS_KEY}:${LAKE_SECRET_KEY}@?endpoint_url=http%3A%2F%2Flake%3A9000
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/config:/opt/airflow/config
    - ./ingestion:/opt/airflow/ingestion
    - ./dbt:/opt/airflow/dbt
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${WAREHOUSE_USER}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD}
      POSTGRES_DB: ${WAREHOUSE_DB}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER} -d ${WAREHOUSE_DB}"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  lake-perms:
    image: alpine:3.20
    command: chown -R 10001:10001 /data   # RustFS roda como UID 10001
    volumes:
      - lake_data:/data
    restart: "no"

  lake:
    image: ${LAKE_IMAGE:-rustfs/rustfs:latest}
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${LAKE_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${LAKE_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # console web
    volumes:
      - lake_data:/data
    depends_on:
      lake-perms:
        condition: service_completed_successfully
    restart: unless-stopped

  lake-init:
    image: amazon/aws-cli:latest
    depends_on:
      lake:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: ${LAKE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${LAKE_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      LAKE_BUCKET: ${LAKE_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          aws --endpoint-url http://lake:9000 s3api head-bucket --bucket "$$LAKE_BUCKET" 2>/dev/null && echo "bucket ja existe" && exit 0
          aws --endpoint-url http://lake:9000 s3 mb "s3://$$LAKE_BUCKET" && echo "bucket pronto" && exit 0
          echo "aguardando o lake..."; sleep 2
        done
        exit 1
    restart: "no"

  # Spark sob demanda: não sobe com "docker compose up". Cada job roda num
  # container que nasce e morre com ele:  docker compose run --rm spark
  spark:
    build: ./spark
    image: brazil-weather-spark:3.5.6
    profiles: ["spark"]
    env_file: .env
    environment:
      # Dentro da rede do Docker o lake é "lake:9000", não "localhost:9000".
      S3_ENDPOINT_URL: http://lake:9000
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./spark/jobs:/opt/spark/jobs
      # O benchmark salva os resultados aqui (docs/benchmark/ do projeto).
      - ./docs:/opt/spark/docs
    depends_on:
      lake:
        condition: service_started
    # Job padrão: o teste de leitura do bronze. Outros jobs são passados no "run".
    command: ["/opt/spark/bin/spark-submit", "--driver-memory", "2g", "teste_bronze.py"]

  # dbt sob demanda, como o Spark:  docker compose run --rm dbt build
  dbt:
    build: ./dbt
    image: brazil-weather-dbt:1.10
    profiles: ["dbt"]
    env_file: .env
    environment:
      DBT_PROFILES_DIR: /usr/app/dbt
      # Dentro da rede do Docker o Postgres é "postgres:5432".
      WAREHOUSE_HOST: postgres
    volumes:
      - ./dbt:/usr/app/dbt
    ports:
      - "8085:8080"   # documentação do dbt (dbt docs serve)
    depends_on:
      postgres:
        condition: service_healthy

  airflow-init:
    <<: *airflow-common
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
    command: version
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pg_data:
  lake_data:
