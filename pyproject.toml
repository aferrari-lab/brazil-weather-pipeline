[project]
name = "data-engineering-clima"
version = "0.1.0"
description = "Pipeline de engenharia de dados: clima diário de todos os municípios do Brasil (Open-Meteo)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["airflow/logs", "dbt"]
# Pastas onde ficam os módulos do projeto (os jobs Spark importam uns aos outros,
# e as DAGs importam o pacote orquestracao/).
src = [".", "spark/jobs", "airflow/dags"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coloco a raiz do projeto no caminho de importação, para os testes acharem
# os pacotes do projeto (ex.: ingestion) rodando só "pytest".
pythonpath = [".", "airflow/dags"]
# Avisos internos do pyspark sobre APIs do pandas/Python que ele ainda usa: não
# vêm do código do projeto, então escondo para não poluir a saída dos testes.
filterwarnings = [
    "ignore:is_datetime64tz_dtype is deprecated",
    "ignore:distutils Version classes are deprecated",
]

[tool.ruff.lint.isort]
# Módulos do próprio projeto: "comum" é o módulo compartilhado dos jobs Spark e
# "orquestracao" o das DAGs.
known-first-party = ["ingestion", "comum", "orquestracao"]
# A pasta airflow/ do projeto tem o mesmo nome do pacote do Airflow; sem esta linha,
# algumas versões do ruff tratam "import airflow" como módulo do projeto.
known-third-party = ["airflow"]
