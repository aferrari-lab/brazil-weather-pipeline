[project]
name = "data-engineering-clima"
version = "0.1.0"
description = "Pipeline de engenharia de dados: clima diário de todos os municípios do Brasil (Open-Meteo)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["airflow/logs", "dbt"]
# Pastas onde ficam os módulos do projeto (os jobs Spark importam uns aos outros).
src = [".", "spark/jobs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coloco a raiz do projeto no caminho de importação, para os testes acharem
# os pacotes do projeto (ex.: ingestion) rodando só "pytest".
pythonpath = ["."]

[tool.ruff.lint.isort]
# Módulos do próprio projeto: "comum" é o módulo compartilhado dos jobs Spark.
known-first-party = ["ingestion", "comum"]
